# Cap the system journal so the SD card cannot fill up.
#
# This is a systemd drop-in: /etc/systemd/journald.conf is left untouched and
# any existing setting there keeps working. The limits only apply when they
# are not already set more strictly.
#
# Without a cap the journal grows until the card is full, which is one of the
# classic ways an unattended Pi stops booting after a power cut.
#
# Storage=persistent
#   Raspberry Pi OS ships "Storage=volatile" (see
#   /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf), which keeps
#   the journal in RAM. That protects the SD card, but it also means EVERY log
#   line is lost the moment the device reboots or loses power - and the
#   backend's stdout/stderr (uvicorn, the I2C/SPI pipelines, tracebacks) is
#   exactly what is needed to find out why the last boot failed.
#   The journal is therefore made persistent here, but strictly bounded:
#   at most 200 MB, at most one month, and at least 500 MB of free space is
#   always kept on the card.
#
#   To go back to the RAM-only journal, delete this file and restart journald:
#     sudo rm /etc/systemd/journald.conf.d/aeris.conf
#     sudo systemctl restart systemd-journald
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=500M
MaxRetentionSec=1month
